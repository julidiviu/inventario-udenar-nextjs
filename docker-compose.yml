services:
  postgres:
    image: postgres:16-alpine
    container_name: inventario_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventario
    ports:
      - "5433:5432"
    volumes:
      - inventario_pgdata:/var/lib/postgresql/data

volumes:
  inventario_pgdata:
